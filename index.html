<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL 보안 검사기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080a0f;
      --surface: #0e1118;
      --surface2: #141820;
      --border: #1e2535;
      --border2: #252d40;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.15);
      --accent2: #06b6d4;
      --good: #10b981;
      --good-bg: rgba(16, 185, 129, 0.08);
      --bad: #ef4444;
      --bad-bg: rgba(239, 68, 68, 0.08);
      --mid: #f59e0b;
      --mid-bg: rgba(245, 158, 11, 0.08);
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #475569;
      --mono: 'Space Mono', monospace;
      --sans: 'Pretendard', 'Noto Sans KR', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 16px 80px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,0.07) 0%, transparent 70%);
    }

    /* ── 헤더 ── */
    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 999px;
      padding: 4px 14px;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--accent2);
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    .header-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent2);
      animation: pulse 2s infinite;
    }

    h1 {
      font-family: var(--mono);
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 10px;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text3);
      font-family: var(--mono);
    }

    /* ── 메인 카드 ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      overflow: hidden;
      animation: fadeUp 0.6s 0.1s ease both;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 24px 64px rgba(0,0,0,0.4);
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }

    .card-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text3);
      margin-left: 6px;
    }

    .card-body { padding: 28px 28px 32px; }

    /* ── 입력창 ── */
    .input-wrap {
      position: relative;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text3);
      font-size: 0.9rem;
      pointer-events: none;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.82rem;
      padding: 13px 14px 13px 38px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
    }

    input[type="text"]::placeholder { color: var(--text3); }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 22px;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── 진행 바 ── */
    .progress-wrap {
      margin-top: 20px;
      display: none;
    }

    .progress-steps {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text3);
      font-family: var(--mono);
      transition: color 0.3s;
    }

    .step.active { color: var(--accent2); }
    .step.done { color: var(--good); }

    .step-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border2);
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .step.active .step-dot { background: var(--accent2); animation: pulse 1s infinite; }
    .step.done .step-dot { background: var(--good); }

    .progress-bar-bg {
      height: 2px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      width: 0%;
      transition: width 0.5s ease;
    }

    /* ── 결과 ── */
    .result-wrap {
      margin-top: 24px;
      display: none;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .grade-ring {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .grade-ring svg {
      transform: rotate(-90deg);
      width: 72px;
      height: 72px;
    }

    .grade-ring circle {
      fill: none;
      stroke-width: 5;
    }

    .ring-bg { stroke: var(--border2); }
    .ring-fill {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 188;
      stroke-dashoffset: 188;
      transition: stroke-dashoffset 1s ease, stroke 0.3s;
    }

    .grade-letter {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }

    .score-info { flex: 1; }

    .score-num {
      font-family: var(--mono);
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .score-num span { font-size: 1rem; color: var(--text2); }

    .score-label {
      font-size: 0.78rem;
      color: var(--text2);
      line-height: 1.5;
    }

    .score-meta {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text3);
      margin-top: 4px;
    }

    /* ── 체크 목록 ── */
    .checks-label {
      font-size: 0.72rem;
      font-family: var(--mono);
      color: var(--text3);
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    #resultList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #resultList li {
      background: var(--surface2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: fadeUp 0.3s ease both;
    }

    #resultList li.good { border-color: rgba(16,185,129,0.25); background: var(--good-bg); }
    #resultList li.bad  { border-color: rgba(239,68,68,0.25);  background: var(--bad-bg); }
    #resultList li.mid  { border-color: rgba(245,158,11,0.25); background: var(--mid-bg); }

    .check-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .good .check-icon { background: rgba(16,185,129,0.2); color: var(--good); }
    .bad  .check-icon { background: rgba(239,68,68,0.2);  color: var(--bad); }
    .mid  .check-icon { background: rgba(245,158,11,0.2); color: var(--mid); }

    .check-content { flex: 1; }

    .check-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
      font-size: 0.83rem;
    }

    .good .check-title { color: var(--good); }
    .bad  .check-title { color: var(--bad); }
    .mid  .check-title { color: var(--mid); }

    .check-msg { color: var(--text2); font-size: 0.78rem; line-height: 1.5; }

    /* ── 애니메이션 ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── 히스토리 ── */
    .history-wrap {
      width: 100%;
      max-width: 680px;
      margin-top: 20px;
      animation: fadeUp 0.5s 0.2s ease both;
    }

    .history-label {
      font-size: 0.7rem;
      font-family: var(--mono);
      color: var(--text3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .history-item:hover {
      border-color: var(--border2);
      background: var(--surface2);
    }

    .history-grade {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .grade-A { background: rgba(16,185,129,0.15); color: var(--good); }
    .grade-B { background: rgba(59,130,246,0.15);  color: var(--accent); }
    .grade-C { background: rgba(245,158,11,0.15);  color: var(--mid); }
    .grade-D { background: rgba(239,68,68,0.15);   color: var(--bad); }

    .history-url {
      flex: 1;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-score {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text3);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-badge">URL_SECURITY_CHECKER v2.0</div>
    <h1>🔍 URL <span>보안</span> 검사기</h1>
    <p class="subtitle">// 실시간 SSL · 헤더 · 리다이렉트 분석</p>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <span class="card-title">security-scanner.sh</span>
    </div>
    <div class="card-body">
      <div class="input-wrap">
        <span class="input-icon">🔗</span>
        <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off" />
        <button class="btn" id="checkBtn">검사</button>
      </div>

      <!-- 진행 상태 -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-steps">
          <div class="step" id="step1"><div class="step-dot"></div>DNS 확인</div>
          <div class="step" id="step2"><div class="step-dot"></div>접속 시도</div>
          <div class="step" id="step3"><div class="step-dot"></div>SSL 검사</div>
          <div class="step" id="step4"><div class="step-dot"></div>헤더 분석</div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <!-- 결과 -->
      <div class="result-wrap" id="resultWrap">
        <div class="score-row">
          <div class="grade-ring">
            <svg viewBox="0 0 72 72">
              <circle class="ring-bg" cx="36" cy="36" r="30"/>
              <circle class="ring-fill" id="ringFill" cx="36" cy="36" r="30"/>
            </svg>
            <div class="grade-letter" id="gradeValue">?</div>
          </div>
          <div class="score-info">
            <div class="score-num"><span id="scoreValue">--</span> <span>점</span></div>
            <div class="score-label" id="scoreText">URL을 입력하고 검사를 시작하세요.</div>
            <div class="score-meta" id="scoreMeta"></div>
          </div>
        </div>

        <div class="checks-label">검사 항목</div>
        <ul id="resultList"></ul>
      </div>
    </div>
  </div>

  <!-- 히스토리 -->
  <div class="history-wrap" id="historyWrap" style="display:none">
    <div class="history-label">최근 검사 기록</div>
    <div class="history-list" id="historyList"></div>
  </div>

<script>
  const urlInput   = document.getElementById("urlInput");
  const checkBtn   = document.getElementById("checkBtn");
  const progressWrap = document.getElementById("progressWrap");
  const progressBar  = document.getElementById("progressBar");
  const resultWrap   = document.getElementById("resultWrap");
  const scoreText    = document.getElementById("scoreText");
  const scoreValue   = document.getElementById("scoreValue");
  const gradeValue   = document.getElementById("gradeValue");
  const scoreMeta    = document.getElementById("scoreMeta");
  const resultList   = document.getElementById("resultList");
  const ringFill     = document.getElementById("ringFill");
  const historyWrap  = document.getElementById("historyWrap");
  const historyList  = document.getElementById("historyList");

  const GRADE_COLORS = { A: "#10b981", B: "#3b82f6", C: "#f59e0b", D: "#ef4444" };

  // ── 히스토리 ──
  let history = JSON.parse(localStorage.getItem("urlCheckHistory") || "[]");

  function saveHistory(url, score, grade) {
    history = [{ url, score, grade, time: Date.now() }, ...history.filter(h => h.url !== url)].slice(0, 5);
    localStorage.setItem("urlCheckHistory", JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    if (!history.length) { historyWrap.style.display = "none"; return; }
    historyWrap.style.display = "block";
    historyList.innerHTML = history.map(h => `
      <div class="history-item" onclick="loadHistory('${h.url.replace(/'/g, "\\'")}')">
        <div class="history-grade grade-${h.grade}">${h.grade}</div>
        <div class="history-url">${h.url}</div>
        <div class="history-score">${h.score}점</div>
      </div>
    `).join("");
  }

  function loadHistory(url) {
    urlInput.value = url;
    runCheck();
  }

  renderHistory();

  // ── 진행 상태 ──
  function setStep(n) {
    [1,2,3,4].forEach(i => {
      const el = document.getElementById("step" + i);
      el.classList.remove("active", "done");
      if (i < n) el.classList.add("done");
      else if (i === n) el.classList.add("active");
    });
    progressBar.style.width = ((n - 1) / 3 * 100) + "%";
  }

  function completeProgress() {
    [1,2,3,4].forEach(i => {
      const el = document.getElementById("step" + i);
      el.classList.remove("active");
      el.classList.add("done");
    });
    progressBar.style.width = "100%";
  }

  // ── 결과 렌더 ──
  function addResult(title, message, level, delay) {
    const icons = { good: "✓", bad: "✗", mid: "!" };
    const li = document.createElement("li");
    li.className = level;
    li.style.animationDelay = delay + "ms";
    li.innerHTML = `
      <div class="check-icon">${icons[level]}</div>
      <div class="check-content">
        <div class="check-title">${title}</div>
        <div class="check-msg">${message}</div>
      </div>`;
    resultList.appendChild(li);
  }

  function setScore(score, grade, text, meta) {
    scoreValue.textContent = score === "--" ? "--" : score;
    gradeValue.textContent = grade;
    scoreText.textContent  = text;
    scoreMeta.textContent  = meta || "";

    const color = GRADE_COLORS[grade] || "#475569";
    gradeValue.style.color = color;
    ringFill.style.stroke  = color;

    const circumference = 188;
    const pct = typeof score === "number" ? score / 100 : 0;
    ringFill.style.strokeDashoffset = circumference * (1 - pct);
  }

  // ── 메인 검사 ──
  async function runCheck() {
    const raw = urlInput.value.trim();
    if (!raw) return;

    resultList.innerHTML = "";
    resultWrap.style.display = "none";
    progressWrap.style.display = "block";
    checkBtn.disabled = true;
    setStep(1);
    ringFill.style.strokeDashoffset = 188;
    setScore("--", "?", "검사 중...", "");

    let url;
    try {
      url = new URL(raw.startsWith("http") ? raw : "https://" + raw);
    } catch {
      progressWrap.style.display = "none";
      resultWrap.style.display = "block";
      setScore(0, "D", "URL 형식 오류", "");
      addResult("URL 형식 오류", "올바른 주소를 입력하세요. 예: https://example.com", "bad", 0);
      checkBtn.disabled = false;
      return;
    }

    urlInput.value = url.href;

    // 단계 시뮬레이션
    await new Promise(r => setTimeout(r, 400)); setStep(2);
    await new Promise(r => setTimeout(r, 400)); setStep(3);
    await new Promise(r => setTimeout(r, 300)); setStep(4);

    try {
      const res = await fetch("/api/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url.href })
      });

      const data = await res.json();
      completeProgress();

      await new Promise(r => setTimeout(r, 300));
      progressWrap.style.display = "none";
      resultWrap.style.display = "block";

      if (!res.ok) {
        setScore(0, "D", "검사 실패", "");
        addResult("검사 실패", data.error || "서버 오류가 발생했습니다.", "bad", 0);
      } else {
        const redirected = data.finalUrl !== data.requestedUrl;
        const meta = redirected ? `리다이렉트 → ${data.finalUrl}` : `직접 연결: ${data.finalUrl}`;
        setScore(data.score, data.grade, gradeText(data.score), meta);
        data.checks.forEach((c, i) => addResult(c.title, c.message, c.level, i * 60));
        saveHistory(url.href, data.score, data.grade);
      }
    } catch {
      progressWrap.style.display = "none";
      resultWrap.style.display = "block";
      setScore(0, "D", "API 연결 실패", "");
      addResult("API 연결 실패", "Vercel에 배포된 환경에서만 실제 검사가 작동합니다.", "bad", 0);
    }

    checkBtn.disabled = false;
  }

  function gradeText(score) {
    if (score >= 90) return "매우 안전한 사이트입니다.";
    if (score >= 75) return "대체로 안전하지만 일부 개선이 필요합니다.";
    if (score >= 55) return "보안 설정이 미흡합니다. 주의가 필요합니다.";
    return "위험할 수 있는 사이트입니다. 접속에 주의하세요.";
  }

  checkBtn.addEventListener("click", runCheck);
  urlInput.addEventListener("keydown", e => { if (e.key === "Enter") runCheck(); });
</script>

</body>
</html>
