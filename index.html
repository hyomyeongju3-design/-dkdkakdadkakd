<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL 보안 검사기</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;700&display=swap');

    :root {
      --bg: #0d0f14;
      --panel: #13161d;
      --border: #1f2430;
      --accent: #00e5ff;
      --good: #00ff88;
      --bad: #ff4466;
      --mid: #ffcc00;
      --text: #c8d0e0;
      --dim: #5a6375;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--dim);
      margin-bottom: 36px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 620px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    button:hover { opacity: 0.85; }

    /* 점수 표시 */
    .score-area {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 24px 0 16px;
    }

    .grade-box {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }

    .score-info {
      flex: 1;
    }

    .score-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.6rem;
      color: var(--accent);
    }

    .score-label {
      font-size: 0.78rem;
      color: var(--dim);
      margin-top: 2px;
    }

    /* 결과 목록 */
    #resultList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    #resultList li {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      border-left: 3px solid var(--border);
      line-height: 1.5;
    }

    #resultList li.good  { border-color: var(--good); color: var(--good); }
    #resultList li.bad   { border-color: var(--bad);  color: var(--bad); }
    #resultList li.mid   { border-color: var(--mid);  color: var(--mid); }

    #resultList li span.title {
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
    }

    #resultList li span.msg {
      color: var(--text);
      font-size: 0.78rem;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <h1>🔍 URL 보안 검사기</h1>
  <p class="subtitle">// URL_SECURITY_CHECKER v1.0</p>

  <div class="card">
    <form id="checkForm">
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off" />
        <button type="submit">검사</button>
      </div>
    </form>

    <hr class="divider" />

    <div class="score-area">
      <div class="grade-box" id="gradeValue">?</div>
      <div class="score-info">
        <div class="score-num"><span id="scoreValue">--</span>점</div>
        <div class="score-label" id="scoreText">URL을 입력하고 검사를 시작하세요.</div>
      </div>
    </div>

    <ul id="resultList"></ul>
  </div>

  <script>
    const form        = document.getElementById("checkForm");
    const input       = document.getElementById("urlInput");
    const scoreText   = document.getElementById("scoreText");
    const scoreValue  = document.getElementById("scoreValue");
    const gradeValue  = document.getElementById("gradeValue");
    const resultList  = document.getElementById("resultList");
    const apiUrl      = "/api/check";

    function addResult(title, message, level) {
      const mark = level === "good" ? "✓" : level === "bad" ? "✗" : "!";
      const item = document.createElement("li");
      item.className = level;
      item.innerHTML = `<span class="title">${mark} ${title}</span><span class="msg">${message}</span>`;
      resultList.appendChild(item);
    }

    function setGrade(score, grade, text) {
      gradeValue.textContent = grade;
      scoreValue.textContent = score;
      scoreText.textContent  = text;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      resultList.innerHTML = "";
      setGrade("--", "?", "검사 중입니다...");
      addResult("검사 진행", "사이트 응답, SSL 인증서, 보안 헤더를 확인하고 있습니다.", "mid");

      const raw = input.value.trim();
      let url;

      try {
        url = new URL(raw.startsWith("http") ? raw : "https://" + raw);
      } catch (e) {
        resultList.innerHTML = "";
        setGrade(0, "D", "URL 형식이 올바르지 않습니다.");
        addResult("URL 형식 오류", "올바른 주소를 입력하세요. 예: https://example.com", "bad");
        return;
      }

      input.value = url.href;

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url.href })
        });

        const data = await response.json();
        resultList.innerHTML = "";

        if (!response.ok) {
          setGrade(0, "D", "검사를 완료하지 못했습니다.");
          addResult("검사 실패", data.error || "서버에서 오류가 발생했습니다.", "bad");
          return;
        }

        const summary = data.finalUrl === data.requestedUrl
          ? "실제 서버 응답 기준 검사 결과입니다."
          : "리다이렉트 후 최종 주소 기준 검사 결과입니다.";

        setGrade(data.score, data.grade, summary);
        data.checks.forEach(function (check) {
          addResult(check.title, check.message, check.level);
        });

      } catch (error) {
        resultList.innerHTML = "";
        setGrade(0, "D", "API 서버 연결이 필요합니다.");
        addResult("API 연결 실패", "GitHub 저장소를 Vercel에 연결해서 배포하면 실제 검사가 작동합니다.", "bad");
      }
    });
  </script>

</body>
</html>
